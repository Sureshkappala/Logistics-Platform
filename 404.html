<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Route Not Found | Stackly</title>
  <meta name="description" content="The requested logistics route or page could not be located in our dispatch directory.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; background-color: var(--navy-950); margin: 0; color: var(--white);">

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 4rem 1.5rem; text-align: center;">
    <div style="max-width: 620px; margin: 0 auto; width: 100%;">
      
      <!-- Stackly Brand Logo -->
      <div style="margin-bottom: 2rem;">
        <a href="index.html" aria-label="Return to Stackly Home">
          <img src="assets/images/logo-white.webp" alt="Stackly" class="brand-logo-img" width="160" height="46" style="display: inline-block;">
        </a>
      </div>

      <!-- Transportation Themed SVG -->
      <div style="width: 130px; height: 130px; margin: 0 auto 1.75rem; background-color: rgba(249, 115, 22, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px dashed var(--amber-500);">
        <svg width="64" height="64" fill="none" stroke="#f97316" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
          <circle cx="12" cy="11" r="3" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
          <line x1="4" y1="4" x2="20" y2="20" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="section-tag section-tag-amber" style="margin-bottom: 0.75rem;">Error 404 &bull; Deadhead Navigation</div>
      <h1 style="font-size: 3rem; font-weight: 900; margin-bottom: 0.75rem; letter-spacing: -0.02em; color: var(--white);">Route Not Found</h1>
      <p style="font-size: 1.125rem; color: var(--gray-300); margin-bottom: 2.25rem; line-height: 1.6;">
        The waypoint or logistics page you are attempting to reach has been rerouted, decommissioned, or does not exist on this network.
      </p>

      <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="index.html" class="btn btn-primary btn-lg">Back to Home</a>
        <button onclick="window.history.back()" class="btn btn-outline-white btn-lg" style="cursor: pointer;">Go Back</button>
      </div>

      <!-- Quick Navigation Hint -->
      <div style="margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(255, 255, 255, 0.1); font-size: 0.9rem; color: var(--gray-400);">
        Need dispatch assistance? <a href="contact.html" style="color: #2dd4bf; text-decoration: underline;">Contact 24/7 Operations</a>
      </div>
    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
